# Surface Pro 11 (Denali) dracut policy.
# Host-only initramfs must carry the DSP firmware, or the ADSP is started without it (no audio, no battery).
install_items+=" /usr/lib/firmware/qcom/x1e80100/microsoft/Denali/* "
# The rescue entry would not carry the device tree; do not generate it.
dracut_rescue_image="no"
# FIPS mode is never used on this system.
omit_dracutmodules+=" fips fips-crypto-policies "
