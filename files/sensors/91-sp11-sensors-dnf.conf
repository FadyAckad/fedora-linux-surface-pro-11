# Surface Pro 11: iio-sensor-proxy is rebuilt with its Qualcomm Sensor Core drivers (libssc), which Fedora's own
# build leaves out because libssc is not packaged in Fedora. dnf must not replace it with a later Fedora build:
# that would take auto-rotation and the ambient light sensor away without a word. Remove this file once Fedora's
# package carries SSC support. The exclusion also filters a local RPM of the package (dnf5 applies it to
# @commandline), so install the stack's four RPMs in one transaction, and install a later SP11 build with:
#   sudo dnf --setopt=disable_excludes='*' install ./iio-sensor-proxy-<version>.sp11.<n>.fc<release>.aarch64.rpm
[main]
excludepkgs=iio-sensor-proxy
