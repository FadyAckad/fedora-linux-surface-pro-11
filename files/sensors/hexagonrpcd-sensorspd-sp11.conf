# Surface Pro 11 drop-in for hexagonrpcd-adsp-sensorspd.service (installed as
# /usr/lib/systemd/system/hexagonrpcd-adsp-sensorspd.service.d/10-sp11.conf).
# Serve /var/lib/sp11/hexagonrpc (the package's sensor configuration and platform identity, and a writable copy of
# this unit's registry: the framework writes into it while it initialises) attached to the ADSP's sensors protection
# domain. Started by udev when /dev/fastrpc-adsp appears (81-sp11-sensors.rules): the node exists only once the ADSP
# has booted, and the framework does its registry work on the first attach that completes (once per ADSP boot), so
# no earlier instance is needed. The framework aborts the whole ADSP when a
# file operation it relies on fails, and udev would start this unit again after every recovery: sp11-sensors-guard
# refuses to attach once the ADSP has crashed in this boot. It runs as ExecCondition: its exit 3 skips the unit
# without marking it failed, so Restart= never re-runs it (RestartPreventExitStatus= covers the main process only;
# an ExecStartPre failure is restarted until the start limit). A fault therefore costs one crash and a readable log,
# not a loop.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=4

[Service]
ExecCondition=+/usr/libexec/sp11/sp11-sensors-guard
ExecStart=
# stdbuf: the daemon logs every request the DSP makes on stdout, which is fully buffered on the journal socket.
ExecStart=/usr/bin/stdbuf -oL /usr/bin/hexagonrpcd -R /var/lib/sp11/hexagonrpc -f /dev/fastrpc-adsp -d adsp -s
Restart=on-failure
RestartSec=5
