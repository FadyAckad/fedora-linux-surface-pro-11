# Kernels built with a config policy revision (KERNEL_CONFIG_REV in sp11.conf, kernel-sp11 7.2.5-sp11v23.1 on)
# use Fedora's LSM stack: SELinux active, AppArmor not compiled in. This key does not exist there, and the
# leading "-" makes systemd-sysctl skip it silently (sysctl.d(5)). It stays for the earlier SP11 kernels,
# which remain installed next to the new one: their Ubuntu-derived config has AppArmor as the active LSM with
# CONFIG_SECURITY_APPARMOR_RESTRICT_USERNS=y, which denies unprivileged user namespaces to any process without
# an AppArmor profile. Fedora ships no AppArmor userspace or profiles, so Flatpak's bwrap, browsers' sandboxes
# and rootless containers fail with "Creating new namespace failed: Permission denied" unless the restriction
# is lifted, as Fedora's own kernels leave it.
-kernel.apparmor_restrict_unprivileged_userns = 0
