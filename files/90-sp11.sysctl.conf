# Surface Pro 11 kernel (ooaklee, Ubuntu-derived config): AppArmor is the active LSM and
# CONFIG_SECURITY_APPARMOR_RESTRICT_USERNS=y denies unprivileged user namespaces to any process
# without an AppArmor profile. Fedora ships no AppArmor userspace or profiles, so Flatpak's bwrap,
# browsers' sandboxes and rootless containers fail with "Creating new namespace failed: Permission denied".
# Fedora's own kernels leave user namespaces unrestricted; restore that behaviour.
kernel.apparmor_restrict_unprivileged_userns = 0
