# Surface Pro 11: the stock Fedora kernel packages stay installed (the live root keeps kernel-core for Anaconda)
# but must not be upgraded. A newer kernel-core would get a BLS entry without Surface support and, once its
# version passes the SP11 kernel's, would become the default boot entry. The supported kernel is kernel-sp11.
# One-off override: dnf --disableexcludes=all ...
[main]
excludepkgs=kernel,kernel-core,kernel-modules,kernel-modules-core,kernel-modules-extra,kernel-modules-internal
