# Surface Pro 11: the stock Fedora kernel packages stay installed (the live root keeps them for Anaconda)
# but must not be upgraded. A newer stock kernel would get a BLS entry without Surface support and, once its
# version passes the SP11 kernel's, would become the default boot entry. The supported kernel is kernel-sp11.
# On aarch64 the boot kernel is owned by kernel-uki-dtbloader, not kernel-core (Fedora 45 Workstation Live
# installs no kernel-core at all). The kernel-uki-* packages provide installonlypkg(kernel), so dnf adds them
# *alongside* rather than upgrading in place, and their /usr/bin/kernel-install dependency writes the entry.
# The glob covers dtbloader, virt and virt-addons; it deliberately does not match kernel-sp11, which has to
# stay installable from a local RPM.
# The exclusion hides these packages from remove as well as install, so taking a stock kernel off the
# system needs the override too. dnf5 has no --disableexcludes flag (DNF4 spelling); disable_excludes is a
# config option, so it has to go through --setopt:
#   sudo dnf --setopt=disable_excludes='*' remove kernel-uki-dtbloader-<version>
[main]
excludepkgs=kernel,kernel-core,kernel-modules,kernel-modules-core,kernel-modules-extra,kernel-modules-internal,kernel-uki-*
