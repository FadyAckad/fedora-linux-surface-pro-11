# Surface Pro 11: systemd-tpm2-setup-early only in the initramfs. Fedora's initramfs does not carry the unit, so it
# runs in the root, where SELinux refuses its write to /run/log/systemd/tpm2-measure.log; its share of the work
# beyond systemd-tpm2-setup's, NvPCRs, systemd does only in the initramfs (docs/hardware.md, TPM).
[Unit]
ConditionPathExists=/etc/initrd-release
