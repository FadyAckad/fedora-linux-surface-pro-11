# Surface Pro 11: a failed "final" measurement does not turn a poweroff into a restart, as
# sp11-pcrphase-shutdown.conf for "shutdown": after a deep sleep this TPM answered systemd-pcrextend with
# TPM_RC_FAILURE (0x101), and this unit's FailureAction=reboot-force restarted the tablet. Nothing here uses PCR 11
# (docs/hardware.md, TPM).
[Service]
ExecStop=
ExecStop=-/usr/lib/systemd/systemd-pcrextend --graceful final
