# Surface Pro 11 (Denali) dracut policy.
# Host-only initramfs must carry the DSP firmware, or the ADSP is started without it (no audio, no battery). dracut's
# devicetree-firmware module (Fedora 45) copies every firmware-name file of the running device tree as well; this line
# keeps the result independent of the device tree dracut happens to see (a chroot, a rescue environment).
install_items+=" /usr/lib/firmware/qcom/x1e80100/microsoft/Denali/* "
# The GPU probes inside the initramfs (plymouth wants a display) and needs the Adreno microcode there,
# or early boot logs "failed to load gen70500_sqe.fw" until switch-root makes /usr/lib/firmware
# reachable. These come from qcom-firmware, not from this package; the glob covers the .xz suffix.
install_items+=" /usr/lib/firmware/qcom/gen70500_sqe.fw* /usr/lib/firmware/qcom/gen70500_gmu.bin* "
# No rescue entry: 51-dracut-rescue.install copies the kernel's boot entry and replaces the kernel version in it,
# so its "devicetree /dtb-<version>/..." line turns into /dtb-0-rescue-<machine-id>/..., a directory nothing creates,
# and the entry cannot boot (without a device tree the firmware's ACPI tables do not describe this machine).
dracut_rescue_image="no"
