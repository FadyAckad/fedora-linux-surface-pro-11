# Surface Pro 11 (5G SKU): ModemManager keeps the modem across a system sleep instead of dropping and
# probing it again, for a modem that stays powered through the sleep (kernel 7.2.11 revision 9 or later):
# mobile data is back 2 s after a wake instead of 52 s.
[Service]
ExecStart=
ExecStart=/usr/bin/ModemManager --test-quick-suspend-resume
