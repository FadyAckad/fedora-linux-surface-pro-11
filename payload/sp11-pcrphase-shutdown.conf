# Surface Pro 11: a failed shutdown measurement does not turn a poweroff into a restart. At a poweroff systemd
# measures "shutdown" into PCR 11 (only in starts through the signed image, whose stub measures the kernel). After
# a deep sleep this TPM answered systemd-pcrextend with TPM_RC_FAILURE (0x101), and the unit's
# FailureAction=reboot-force restarted the tablet. Nothing here uses PCR 11: a disk key sealed in the TPM is bound
# to PCR 7 (docs/hardware.md, TPM). sp11-pcrphase-final.conf does the same for the "final" measurement.
[Service]
ExecStop=
ExecStop=-/usr/lib/systemd/systemd-pcrextend --graceful shutdown
