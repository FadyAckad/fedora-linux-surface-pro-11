# Surface Pro 11 sensors: the directory hexagonrpcd serves to the ADSP's sensor framework (rendered by
# scripts/45-build-sensors-rpms.sh). The framework writes into its registry while it initialises (entries below
# /persist/sensors/registry/registry, a temporary file next to that directory), so sensors/persist is the writable
# parent hexagonrpcd maps to /persist/sensors/registry, owned by the daemon's user, with the registry copied from
# the package below it and, beside it, the two files Windows keeps in that parent directory (sns_reg_version, which
# the framework creates itself when it is missing, and parsed_file_list.csv); the read-only parts are links into
# the package. The copies are made once (C leaves an existing destination alone), so what the framework writes
# survives reboots; sp11-sensors-reset rebuilds them.
d /var/lib/sp11 0755 root root -
d /var/lib/sp11/hexagonrpc 0755 root root -
d /var/lib/sp11/hexagonrpc/sensors 0755 root root -
L+ /var/lib/sp11/hexagonrpc/sensors/config - - - - @PAYLOAD_DIR@/sensors/config
L+ /var/lib/sp11/hexagonrpc/sensors/sns_reg.conf - - - - @PAYLOAD_DIR@/sensors/sns_reg.conf
L+ /var/lib/sp11/hexagonrpc/socinfo - - - - @PAYLOAD_DIR@/socinfo
d /var/lib/sp11/hexagonrpc/sensors/persist 0755 fastrpc fastrpc -
C /var/lib/sp11/hexagonrpc/sensors/persist/registry 0755 fastrpc fastrpc - @PAYLOAD_DIR@/sensors/registry
C /var/lib/sp11/hexagonrpc/sensors/persist/sns_reg_version 0644 fastrpc fastrpc - @PAYLOAD_DIR@/sensors/registry-parent/sns_reg_version
C /var/lib/sp11/hexagonrpc/sensors/persist/parsed_file_list.csv 0644 fastrpc fastrpc - @PAYLOAD_DIR@/sensors/registry-parent/parsed_file_list.csv
Z /var/lib/sp11/hexagonrpc/sensors/persist - fastrpc fastrpc -
