# Surface Pro 11 drop-in for iio-sensor-proxy.service (installed as
# /usr/lib/systemd/system/iio-sensor-proxy.service.d/10-sp11.conf).
# No GIO module for the proxy. libqmi, through libssc, builds a GFile when the proxy finds its sensors, and that
# loads GIO's modules; gvfs's client module then looks for a session bus through the user runtime directory, which
# for root means reading /etc/passwd and creating /root/.cache. SELinux and the unit's ProtectHome refuse both: five
# denials at every start. The proxy uses no GIO module (no GSettings, TLS, proxies or remote file systems), and
# GIO's local file system is built in.
[Service]
Environment=GIO_MODULE_DIR=/usr/share/empty
