# shellcheck shell=bash
# ---------------------------------------------------------------------------
# Fedora live ISO (Workstation or a spin) for Microsoft Surface
# Pro 11 (Snapdragon X Elite, OLED, incl. the 5G SKU), Fedora 45. Edit this file for a new
# Fedora compose or a new Fedora kernel. Environment variables of the same name
# override the defaults marked with ${VAR:-default}.
# ---------------------------------------------------------------------------

## Fedora source media. FEDORA_TARGET picks the compose family: ga | beta | nightly.
## FEDORA_RELEASE is always the numeric release (dnf --releasever, %{dist}, cache keys);
## FEDORA_MEDIA_VERSION is the version string inside the ISO and CHECKSUM names, which differs for
## pre-release composes. The three families also name their CHECKSUM file differently, so each branch
## spells its own scheme out instead of deriving one from the other. Only Fedora 45 is supported (the kernel
## source RPM below is pinned per release); the default is the 45 Beta until the 45 GA compose is pinned here.
FEDORA_TARGET="${FEDORA_TARGET:-beta}"
FEDORA_ARCH="aarch64"
## FEDORA_EDITION picks the desktop: Workstation, or a spin by the name in its ISO file name (Xfce, LXQt,
## ...). The mirror keeps every spin under Spins/, and the spins of one compose share a single
## Fedora-Spins-...-CHECKSUM, so FEDORA_PRODUCT (directory and CHECKSUM prefix) is not the edition name.
FEDORA_EDITION="${FEDORA_EDITION:-Workstation}"
case "$FEDORA_EDITION" in
  Workstation) FEDORA_PRODUCT=Workstation ;;
  *)           FEDORA_PRODUCT=Spins ;;
esac
case "$FEDORA_TARGET" in
  ga)                                                            # releases/<n>/
    FEDORA_RELEASE="${FEDORA_RELEASE:-45}"
    FEDORA_MEDIA_VERSION="${FEDORA_MEDIA_VERSION:-$FEDORA_RELEASE}"
    FEDORA_COMPOSE="${FEDORA_COMPOSE:?FEDORA_TARGET=ga needs FEDORA_COMPOSE until the 45 GA compose is pinned here (the n.m in its ISO name)}"
    FEDORA_ISO_BASEURL="${FEDORA_ISO_BASEURL:-https://dl.fedoraproject.org/pub/fedora/linux/releases/${FEDORA_RELEASE}/${FEDORA_PRODUCT}/${FEDORA_ARCH}/iso}"
    FEDORA_CHECKSUM_NAME="${FEDORA_CHECKSUM_NAME:-Fedora-${FEDORA_PRODUCT}-${FEDORA_MEDIA_VERSION}-${FEDORA_COMPOSE}-${FEDORA_ARCH}-CHECKSUM}"
    ;;
  beta)                                                          # releases/test/<n>_Beta/
    FEDORA_RELEASE="${FEDORA_RELEASE:-45}"
    FEDORA_MEDIA_VERSION="${FEDORA_MEDIA_VERSION:-${FEDORA_RELEASE}_Beta}"
    FEDORA_COMPOSE="${FEDORA_COMPOSE:-1.3}"
    FEDORA_ISO_BASEURL="${FEDORA_ISO_BASEURL:-https://dl.fedoraproject.org/pub/fedora/linux/releases/test/${FEDORA_MEDIA_VERSION}/${FEDORA_PRODUCT}/${FEDORA_ARCH}/iso}"
    FEDORA_CHECKSUM_NAME="${FEDORA_CHECKSUM_NAME:-Fedora-${FEDORA_PRODUCT}-iso-${FEDORA_MEDIA_VERSION}-${FEDORA_COMPOSE}-${FEDORA_ARCH}-CHECKSUM}"
    ;;
  nightly)                                                       # development/<n>/ - arch precedes the stamp
    FEDORA_RELEASE="${FEDORA_RELEASE:-45}"
    FEDORA_MEDIA_VERSION="${FEDORA_MEDIA_VERSION:-$FEDORA_RELEASE}"
    FEDORA_COMPOSE="${FEDORA_COMPOSE:?FEDORA_TARGET=nightly needs FEDORA_COMPOSE, e.g. 20260915.n.0}"
    FEDORA_ISO_BASEURL="${FEDORA_ISO_BASEURL:-https://dl.fedoraproject.org/pub/fedora/linux/development/${FEDORA_RELEASE}/${FEDORA_PRODUCT}/${FEDORA_ARCH}/iso}"
    FEDORA_CHECKSUM_NAME="${FEDORA_CHECKSUM_NAME:-Fedora-${FEDORA_PRODUCT}-iso-${FEDORA_RELEASE}-${FEDORA_ARCH}-${FEDORA_COMPOSE}-CHECKSUM}"
    ;;
  *) printf 'sp11.conf: unknown FEDORA_TARGET "%s" (ga|beta|nightly)\n' "$FEDORA_TARGET" >&2; exit 1 ;;
esac
FEDORA_ISO_NAME="Fedora-${FEDORA_EDITION}-Live-${FEDORA_MEDIA_VERSION}-${FEDORA_COMPOSE}.${FEDORA_ARCH}.iso"

## Kernel: Fedora's own kernel source RPM for FEDORA_RELEASE, rebuilt in a mock buildroot of that release with the SP11
## patch set (the kernel fork's commits below, applied by kernel.spec as linux-kernel-test.patch) and the configuration
## additions in payload/$KERNEL_CONFIG_FRAGMENT (kernel.spec's kernel-local, merged into Fedora's configuration), under
## kernel.spec's buildid .sp11.<KERNEL_SP11_REV>. The result is Fedora's kernel package family (kernel, kernel-core,
## kernel-modules{,-core,-extra}, ...), uname <version>-<release>.sp11.<rev>.fc<n>.aarch64. See docs/kernel.md.
KERNEL_FEDORA_VERSION="7.2.7"
KERNEL_FEDORA_RELEASE="300"                                      # Fedora's package release (before the dist tag)
KERNEL_SRPM="kernel-${KERNEL_FEDORA_VERSION}-${KERNEL_FEDORA_RELEASE}.fc${FEDORA_RELEASE}.src.rpm"
KERNEL_SRPM_URL="https://kojipkgs.fedoraproject.org/packages/kernel/${KERNEL_FEDORA_VERSION}/${KERNEL_FEDORA_RELEASE}.fc${FEDORA_RELEASE}/src/${KERNEL_SRPM}"
case "$KERNEL_SRPM" in                                           # sha256 of the Koji source RPM
  kernel-7.2.5-300.fc45.src.rpm) KERNEL_SRPM_SHA256="486134f09ad90225f8799a68842e04566ca57b5e30f060e3b96e2a01252450ea" ;;
  kernel-7.2.7-300.fc45.src.rpm) KERNEL_SRPM_SHA256="48b0799b218de2c3c7b1b4ee4d592360eaa187b7d6538cb74cfd5fbf5d6227cf" ;;
  *) printf 'sp11.conf: no pinned checksum for %s (known: kernel-7.2.5-300.fc45, kernel-7.2.7-300.fc45)\n' "$KERNEL_SRPM" >&2; exit 1 ;;
esac
## The SP11 patch set: one commit per patch on the branch sp11/<version> of the project's fork of the stable kernel, on
## top of the stable tag whose tree Fedora's source tarball carries. A pushed branch is never rewritten, so every
## pinned commit stays fetchable; a rebase goes on a new branch. Step 10 fetches the pinned commit back to the base
## and writes the series; step 20 checks that the series rebuilds the commit's tree before kernel.spec applies it.
## KERNEL_PATCH_REPO=<path of a local clone> builds a rebase before its branch is pushed.
KERNEL_PATCH_REPO="${KERNEL_PATCH_REPO:-https://github.com/FadyAckad/linux.git}"
KERNEL_PATCH_BASE="v${KERNEL_FEDORA_VERSION}"
KERNEL_PATCH_BASE_COMMIT="f42acb3678424d1e08f6ed27c0d8ba8a125e14d6"   # v7.2.7
KERNEL_PATCH_COMMIT="8ed6c0df56a7c5e8d8a37ad742c1cafbdf57cbd7"        # sp11/7.2.7, 58 commits
## SP11 revision: the patch set and the configuration additions this repository carries on top of Fedora's kernel. It
## enters the buildid, so every change ships as a new install-only kernel next to the previous one instead of colliding
## with its /boot and module paths; bump it with every change to KERNEL_PATCH_COMMIT or payload/$KERNEL_CONFIG_FRAGMENT.
## KERNEL_SP11_REV_SHA256 pins the content of the declared revision (kernel_rev_sha256 in scripts/lib.sh: the revision
## number, the effective kernel-local lines and the two pinned commits, whose ids fix the patch set; comments do not
## count). Step 20 refuses a patch set or fragment that differs from it; bump KERNEL_SP11_REV, then set this to the
## value the refusal prints.
KERNEL_SP11_REV="${KERNEL_SP11_REV:-5}"
KERNEL_SP11_REV_SHA256="f567e65bd67da1870011c9f7f5c8b4f45dd669779a155e751bba74a35ebeaf00"   # revision 5
KERNEL_CONFIG_FRAGMENT="kernel-local"
KERNEL_BUILDID=".sp11.${KERNEL_SP11_REV}"
KERNEL_RPM_RELEASE="${KERNEL_FEDORA_RELEASE}${KERNEL_BUILDID}.fc${FEDORA_RELEASE}"
KERNEL_ABI="${KERNEL_FEDORA_VERSION}-${KERNEL_RPM_RELEASE}.${FEDORA_ARCH}"   # uname -r
## The kernel packages the live media and an installation carry: the set Fedora's Workstation Live installs, with
## kernel-core in place of kernel-uki-dtbloader (the device tree comes from GRUB_DEVICETREE, see docs/fedora-media.md).
KERNEL_PKGS="kernel kernel-core kernel-modules-core kernel-modules kernel-modules-extra"
## Stock kernel packages the ISO removes from the live root and dnf keeps off the system (support RPM).
KERNEL_STOCK_PKGS="kernel kernel-core kernel-modules kernel-modules-core kernel-modules-extra kernel-modules-internal kernel-uki-*"
## kernel.spec build switches: the base kernel only, no virt UKIs, no source-map package, no docs or headers;
## kernel-uki-dtbloader is still built (Workstation's own flavour, for a later test of automatic DTB selection). Not
## --without debuginfo: the spec then sets DEBUG_INFO_NONE, which also drops BTF and everything built on it (sched_ext,
## BPF qdiscs, io_uring BPF ops, BTF probe arguments), so the configuration would no longer be Fedora's. The
## -debuginfo packages stay in the mock result directory (mock_rebuild_family does not copy them).
KERNEL_MOCK_OPTS="--with baseonly --without efiuki --without kmap --without doc --without headers --without cross_headers --without kabichk --without kabidwchk --without ynl"
## Fedora's own kernel-core of the same build: step 20 compares the SP11 kernel's configuration with the one Fedora
## shipped (only kernel-local and the toolchain-derived values may differ).
KERNEL_STOCK_CORE_RPM="kernel-core-${KERNEL_FEDORA_VERSION}-${KERNEL_FEDORA_RELEASE}.fc${FEDORA_RELEASE}.${FEDORA_ARCH}.rpm"
KERNEL_STOCK_CORE_URL="https://kojipkgs.fedoraproject.org/packages/kernel/${KERNEL_FEDORA_VERSION}/${KERNEL_FEDORA_RELEASE}.fc${FEDORA_RELEASE}/${FEDORA_ARCH}/${KERNEL_STOCK_CORE_RPM}"
case "$KERNEL_STOCK_CORE_RPM" in
  kernel-core-7.2.5-300.fc45.aarch64.rpm) KERNEL_STOCK_CORE_SHA256="89afecbc21b4b5447c86eced39e84490a4dae1201db7989b010952f1906bc925" ;;
  kernel-core-7.2.7-300.fc45.aarch64.rpm) KERNEL_STOCK_CORE_SHA256="91e24d566d22fa1b97757dd883b318abc8d2829a0dc161e33d3f20470f82bcf4" ;;
  *) printf 'sp11.conf: no pinned checksum for %s\n' "$KERNEL_STOCK_CORE_RPM" >&2; exit 1 ;;
esac

## Device tree (X1E80100 + Samsung OLED panel = "Denali OLED")
SP11_DTB="qcom/x1e80100-microsoft-denali-oled.dtb"

## Kernel command line policy: Fedora's Snapdragon X Elite arguments (wiki "Snapdragon WoA Laptop Install") plus the
## SP11 audio patches' SoundWire feedback-port parameter; the live media also keeps the ADSP off (USB-C reset).
SP11_ARGS_INSTALLED="clk_ignore_unused pd_ignore_unused systemd.tpm2_wait=0 soundwire_qcom.sp11_feedback_active_offset2_zero=1"
SP11_ARGS_LIVE_ONLY="modprobe.blacklist=qcom_q6v5_pas rd.driver.blacklist=qcom_q6v5_pas"
# GRUB runs at the panel's native mode; legible text comes from a large console font instead of a low
# resolution. `auto` behind the explicit mode covers a firmware GOP that does not offer 2880x1920.
GRUB_GFXMODE_VALUE="2880x1920,auto"
GRUB_GFXMODE_FALLBACK_VALUE="1024x768,800x600,auto"   # live menu only, if the SP11 font fails to load
GRUB_FONT_SIZE="40"                                   # DejaVu Sans Mono pt size -> 24x48 px cell (PF2 header), 120x40 chars
GRUB_FONT_NAME="SP11 Console"                         # PF2 font name (Bitstream-Vera licence: no "Bitstream"/"Vera")
GRUB_FONT_FILE="sp11-console.pf2"
GRUB_TIMEOUT_VALUE="10"

## Audio userspace: ooaklee FullIO v19c topology + ALSA UCM
AUDIO_RELEASE_TAG="sp11-audio-v19c"
AUDIO_RELEASE_BASEURL="https://github.com/ooaklee/linux-surface-pro-11-oe/releases/download/${AUDIO_RELEASE_TAG}"
AUDIO_FILES="SHA256SUMS MICROSOFT-Surface-Pro-11in.conf SP11-HiFi.conf X1E80100-Microsoft-Surface-Pro-11-tplg.bin x1e80100.conf"
# ALSA UCM device matcher (POSIX ERE) tested against "<board_vendor>-<product_family>-<board_name>".
# ooaklee's original lacks "( with 5G)?" and does not match the 5G SKU.
UCM_SP11_REGEX='Microsoft Corporation.*Surface.*Microsoft Surface Pro( with 5G)?, 11th Edition'
# Internal microphone gain: 'TX_DEC0/1 Volume' of the LPASS TX macro, inserted into the Mic device's EnableSequence
# of ooaklee's SP11-HiFi.conf at build time (step 30). ALSA value 0..124 in 1 dB steps, 84 = 0 dB, 100 = +16 dB
# (what upstream alsa-ucm-conf sets for every qcom-lpass DMIC route); v19c sets nothing, so the array captured at
# the 0 dB reset value and speech arrived around -60 dBFS.
UCM_MIC_GAIN="100"

## Pen: unmodified upstream iptsd + ooaklee's SP11 udev/systemd integration templates
IPTSD_REPO="https://github.com/linux-surface/iptsd.git"
IPTSD_COMMIT="a83bc1232f7096f8b33b50fdbda249cd640de670"
IPTSD_VERSION="3.1.0"
IPTSD_RPM_RELEASE="3.sp11"                                       # bump when rpm/sp11-iptsd.spec.in changes
OE_REPO="https://github.com/ooaklee/linux-surface-pro-11-oe.git"
OE_COMMIT="aba8c0b65ea73422c8e15868606bb934780a066e"
# sp11-iptsd links against fmt/spdlog, whose sonames change between Fedora releases, so it must be built
# against the libraries of the target release, not the host's. "auto" builds on the host when the two
# match and in a mock buildroot when they do not; "host" and "mock" force one of the two.
IPTSD_BUILD_MODE="${IPTSD_BUILD_MODE:-auto}"                      # auto | host | mock
MOCK_CONFIG="${MOCK_CONFIG:-fedora-${FEDORA_RELEASE}-${FEDORA_ARCH}}"

## Bluetooth pairings transferred from Windows (scripts/70): USB VID:PID of the devices to export
BT_PAIRING_USB_IDS="045E:0C7A 045E:0C0F"                          # Surface Pro Flex Keyboard, Surface Slim Pen 2

## Fedora packages our RPMs need at runtime that not every live image ships (Workstation lacks spdlog).
## Step 50 installs the ones the live root is missing.
LIVE_EXTRA_PKGS="spdlog fmt inih inih-cpp"                     # sp11-iptsd is linked against them

## Bluetooth public-address helper (raw HCI management socket), pinned OE commit
BT_HELPER_URL="https://raw.githubusercontent.com/ooaklee/linux-surface-pro-11-oe/69f40d58afb4a6e92606d30bdefbd48dbf12a88d/tools/sp11-bt-set-addr.c"
BT_HELPER_SHA256="9c93ff74510add8885a293e554b4cac8088b8e749b03ea7418daa69e28a4587a"

## Wi-Fi (WCN7850) board data: extract the closest entry from linux-firmware's board-2.bin as board.bin
BDENCODER_URL="https://raw.githubusercontent.com/qca/qca-swiss-army-knife/6df4dae3e2f5e4c2903f3cafd40996fc1b3639ce/tools/scripts/ath12k/ath12k-bdencoder"
WIFI_BOARD_ENTRY="bus=pci,vendor=17cb,device=1107,subsystem-vendor=17cb,subsystem-device=3378,qmi-chip-id=2,qmi-board-id=255"

## Hardware identity (validated by scripts/05-detect-hardware.sh against Windows SMBIOS data)
SP11_PRODUCT_REGEX='^Microsoft Surface Pro( with 5G)?, 11th Edition$'
SP11_SKU_REGEX='^Surface_Pro(_with_5G)?_11th_Edition(_For_Business)?_[0-9]{4}$'
WINDOWS_ROOT="${WINDOWS_ROOT:-/mnt/c}"
SP11_BT_MAC="${SP11_BT_MAC:-}"                                  # empty = auto-detect from Windows

## Sensors: accelerometer, gyroscope, magnetometer and ambient light sit behind the ADSP's Snapdragon Sensor Core (no
## bus Linux can see). The installed system reaches them through hexagonrpcd (FastRPC file server the DSP's sensor
## framework reads its configuration and registry through), libssc (QMI client) and iio-sensor-proxy rebuilt with its
## SSC drivers (scripts/45-build-sensors-rpms.sh; step 50 installs the four RPMs into the live root, where they stay
## inert because the live session runs without the ADSP). The registry is per unit and needs elevation on Windows:
## scripts/75-export-sensor-registry.sh, once before the first ISO.
## hexagonrpc comes from the project's fork: upstream linux-msm/hexagonrpc 598b591 (v0.5.0 + 19, 2026-08-24) plus the
## sp11-sensors branch (five commits: hexagonfs write operations, the apps_std write methods, the listener's
## large-buffer fetch and unsupported-request answers, the registry's parent directory, and the fixes those write
## paths needed - descriptor lifetimes, the write ops of an absent mapped directory, the encoded output buffers),
## meant for upstream.
HEXAGONRPC_REPO="https://github.com/FadyAckad/hexagonrpc.git"
HEXAGONRPC_COMMIT="79d1bedce11d2c075f5e3ab945f34e279e416ee0"          # sp11-sensors branch head (2026-09-20)
HEXAGONRPC_VERSION="0.5.0"
HEXAGONRPC_RPM_RELEASE="7.git${HEXAGONRPC_COMMIT:0:7}.sp11"          # bump the number with every change to rpm/hexagonrpc.spec.in, its payload or the pinned commit (rpm compares the git part as a string)
LIBSSC_REPO="https://codeberg.org/DylanVanAssche/libssc.git"
LIBSSC_COMMIT="54dd13e36d65c21263cf5b0f4a70c230a77b26bc"              # 0.4.4 + the NULL-GError fix on open failure (2026-09-09)
LIBSSC_VERSION="0.4.4"
LIBSSC_RPM_RELEASE="2.git${LIBSSC_COMMIT:0:7}.sp11"                   # bump when rpm/libssc.spec.in changes
# iio-sensor-proxy is Fedora's own SRPM of the target release, rebuilt with -Dssc-support=enabled; the release is
# Fedora's plus this suffix (3.9-3.fc45 -> 3.9-3.sp11.1.fc45). Bump the suffix when rpm/iio-sensor-proxy.spec.in changes.
IIO_SENSOR_PROXY_RPM_SUFFIX="sp11.1"
# Fedora's spec the template was derived from (iio-sensor-proxy.spec inside the 3.9-3.fc45 source RPM). Step 45 refuses
# a source RPM whose spec differs, so a change Fedora makes is merged into the template instead of silently dropped.
IIO_SENSOR_PROXY_BASE_SPEC_SHA256="1a51fd8496aa27305bc8fae5d5bbf186ce467b0f2f57f401f1863c647b181a46"
## sp11-sensors RPM; bump with every change to its payload: payload/sensors/ (hexagonrpc's two files and the unpackaged
## sp11-sam-posture aside), rpm/sp11-sensors.spec.in, the registry export. Step 45 refuses a changed payload without a bump.
SENSORS_VERSION="1.10"
SENSORS_PAYLOAD_DIR="/usr/share/qcom/x1e80100/Microsoft/denali-oled" # hexagonrpcd -R; what it derives from the DT model and compatible
SENSORS_SNSCFG_GLOB="surfacepro_snscfgcrd8380.inf_*"                  # Windows DriverStore package with the SSC sensor configuration
SENSORS_QMI_SERVICE="400"                                              # QMI_SERVICE_SSC: what the ADSP publishes on QRTR once the sensors are up
## Runtime dependencies of the sensors RPMs that a live root may lack (the 45 Beta Workstation root has them all),
## downloaded by step 10; step 50 installs the missing ones into the live root, step 46 into its overlay.
SENSORS_DEPS_PKGS="libqmi libqrtr-glib protobuf-c libgudev polkit-libs qrtr json-c"

## Output
OUTPUT_ISO_NAME="Fedora-${FEDORA_EDITION}-Live-${FEDORA_MEDIA_VERSION}-${FEDORA_COMPOSE}-SP11-${KERNEL_ABI%."$FEDORA_ARCH"}.${FEDORA_ARCH}.iso"
